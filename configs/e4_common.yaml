# E4 학습 레시피. 네 칸에 동일하게 적용한다.
#
# 아래 키는 두 종류다.
#   - 표시 없는 키: 코드가 실제로 읽어 동작을 바꾼다. 값을 고치면 학습이 달라진다.
#   - [record-only]: 코드가 읽지 않는다. 실행된 설정을 기록으로 남기기 위한 것이며,
#     값을 고쳐도 아무 일도 일어나지 않는다. 구현이 그 값 하나만 지원하는 경우다.
#
# upstream 레시피에서 벗어나는 곳은 두 군데다.
#   1. crop_scale — DeiT 원값 (0.08, 1.0) 대신 (0.6, 1.0). 네 칸에 같은 변환이 걸리고
#      칸마다 다른 파라미터가 없으므로 요인 비교에 남는 영향이 없다.
#   2. weight decay 제외 집합에서 B·D의 mamba `A_log`·`A_b_log`가 빠진다
#      (bench/train.py의 param_groups). Vim 원 스크립트는 timm의
#      param_groups_weight_decay를 쓰는데 그 함수가 `_no_weight_decay` 표식을 보지
#      않아 두 파라미터를 decay한다. 이쪽은 mamba upstream이 단 표식을 따른다 —
#      A = -exp(A_log)이므로 decay가 SSM 시간상수를 미는 것을 막기 위한 표식이다.
#      규칙 자체는 네 칸에 동일하지만 그런 파라미터가 B·D에만 있어, 이 한 가지는
#      연산자 주효과 쪽에만 걸리는 편차다. A·C의 제외 집합은 DeiT 원 레시피
#      (timm param_groups_weight_decay + model.no_weight_decay())와 정확히 같다.
#      단, 이 상쇄는 B와 D에서 이 규칙이 만드는 효과 크기(δ)가 같을 때만 정확하다.
#      마킹되는 A_log·A_b_log 개수가 B 48개, D 32개로 깊이·폭이 다르므로 δ_B = δ_D가
#      정확히 성립한다는 보장은 없고, 구조 주효과·상호작용 항에 작은 잔차가 남을
#      여지가 있다. 잔차가 0이 아닐 수 있다는 뜻이지, 크다는 뜻은 아니다.
# 이전 버전은 pos_embed·cls_token이 decay를 받는 것을 두 번째 편차로 적었다. 그것은
# param_groups가 이제 model.no_weight_decay()를 읽으므로 사라졌다.
epochs: 300
batch_size: 256
workers: 8
lr: 0.00025          # 5e-4 x 256/512
min_lr: 0.00001
warmup_epochs: 5
weight_decay: 0.05
label_smoothing: 0.1 # mixup이 켜져 있으므로 Mixup의 soft target으로 들어간다
mixup: 0.8
cutmix: 1.0
drop_path: 0.1
crop_scale: [0.6, 1.0]   # DeiT 원값 (0.08, 1.0)에서 벗어남 — 64px에서 8%는 5x5 픽셀
amp: fp16            # [record-only] bench/train.py가 torch.float16으로 고정
ema: false           # [record-only] EMA 경로 자체가 구현돼 있지 않다
seeds: [1, 2, 3]
img_size: 64
num_classes: 200

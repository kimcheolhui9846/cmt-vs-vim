# E4 학습 레시피. 네 칸에 동일하게 적용한다.
#
# 아래 키는 두 종류다.
#   - 표시 없는 키: 코드가 실제로 읽어 동작을 바꾼다. 값을 고치면 학습이 달라진다.
#   - [record-only]: 코드가 읽지 않는다. 실행된 설정을 기록으로 남기기 위한 것이며,
#     값을 고쳐도 아무 일도 일어나지 않는다. 구현이 그 값 하나만 지원하는 경우다.
#
# 원 DeiT 레시피에서 벗어나는 곳은 두 군데다: crop_scale, 그리고 pos_embed·cls_token에
# weight decay가 걸린다는 점(bench/train.py의 param_groups 참조). 둘 다 네 칸에 동일
# 적용하므로 요인 비교에는 영향이 없다.
epochs: 300
batch_size: 256
workers: 8
lr: 0.00025          # 5e-4 x 256/512
min_lr: 0.00001
warmup_epochs: 5
weight_decay: 0.05
label_smoothing: 0.1 # mixup이 켜져 있으므로 Mixup의 soft target으로 들어간다
mixup: 0.8
cutmix: 1.0
drop_path: 0.1
crop_scale: [0.6, 1.0]   # DeiT 원값 (0.08, 1.0)에서 벗어남 — 64px에서 8%는 5x5 픽셀
amp: fp16            # [record-only] bench/train.py가 torch.float16으로 고정
ema: false           # [record-only] EMA 경로 자체가 구현돼 있지 않다
seeds: [1, 2, 3]
img_size: 64
num_classes: 200
